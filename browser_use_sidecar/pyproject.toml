[project]
name = "mediacrawler-x-browser-use-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "browser-use==0.13.4",
]

[project.scripts]
mediacrawler-x-browser-use = "x_extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["x_extract.py"]
